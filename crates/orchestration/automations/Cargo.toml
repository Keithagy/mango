[package]
name = "mango-automations"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
mango-automation-protocol = { path = "../automation-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
wasmtime = "30.0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wat = "1"

[lints]
workspace = true
