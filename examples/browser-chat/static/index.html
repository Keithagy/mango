<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browser-chat</title>
    <style>
      :root {
        --paper: #f5efe4;
        --ink: #241d18;
        --line: #d6c5af;
        --accent: #c96e21;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fbf7f0 0, var(--paper) 48%, #efe3d0 100%);
      }
      main {
        width: min(960px, calc(100vw - 32px));
        margin: 24px auto;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255,255,255,0.38);
        box-shadow: 0 18px 50px rgba(80, 55, 20, 0.08);
      }
      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 72px);
        line-height: 0.95;
      }
      p {
        margin: 8px 0 0;
        font-size: 18px;
      }
      #log {
        margin: 28px 0 18px;
        min-height: 420px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255,255,255,0.42);
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .bubble { margin: 0 0 18px; font-size: 18px; line-height: 1.5; }
      .bubble.user { color: #5e4230; }
      .bubble.assistant { color: var(--ink); }
      .status { color: #8b6d4d; font-style: italic; }
      .error { color: #9f2f24; }
      form {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 14px;
        align-items: end;
      }
      textarea {
        min-height: 120px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255,255,255,0.7);
        color: inherit;
        font: inherit;
        resize: vertical;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 16px 24px;
        font: inherit;
        cursor: pointer;
      }
      button[type="submit"] {
        background: var(--accent);
        color: #fff7ee;
      }
      #interrupt {
        background: rgba(36, 29, 24, 0.08);
        color: var(--ink);
      }
      @media (max-width: 760px) {
        form { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>browser-chat</h1>
      <p>Simple cancellable chat assembled on top of <code>mango-core</code>.</p>
      <section id="log"></section>
      <form id="composer">
        <textarea id="prompt" placeholder="Say anything. This runs locally and uses your Claude login."></textarea>
        <button id="interrupt" type="button">Interrupt</button>
        <button type="submit">Send</button>
      </form>
    </main>
    <script>
      const log = document.getElementById("log");
      const composer = document.getElementById("composer");
      const prompt = document.getElementById("prompt");
      const interrupt = document.getElementById("interrupt");

      let statusNode = null;
      let assistantNode = null;

      function appendBubble(kind, text) {
        const node = document.createElement("div");
        node.className = `bubble ${kind}`;
        node.textContent = text;
        log.appendChild(node);
        log.scrollTop = log.scrollHeight;
        return node;
      }

      const source = new EventSource("/api/events");
      source.onmessage = (event) => {
        const data = JSON.parse(event.data);
        switch (data.kind) {
          case "input_echo":
            assistantNode = null;
            appendBubble("user", data.text);
            break;
          case "assistant_token":
            if (!assistantNode) {
              assistantNode = appendBubble("assistant", "");
            }
            assistantNode.textContent += data.text;
            log.scrollTop = log.scrollHeight;
            break;
          case "status":
            if (!statusNode) {
              statusNode = appendBubble("status", data.text);
            } else {
              statusNode.textContent = data.text;
            }
            break;
          case "status_clear":
            if (statusNode) {
              statusNode.remove();
              statusNode = null;
            }
            break;
          case "error":
            appendBubble("error", data.text);
            break;
        }
      };

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text) return;
        prompt.value = "";
        assistantNode = null;
        await fetch("/api/message", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        });
      });

      interrupt.addEventListener("click", async () => {
        await fetch("/api/interrupt", { method: "POST" });
      });
    </script>
  </body>
</html>
