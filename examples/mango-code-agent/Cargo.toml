[package]
name = "mango-code-agent"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
mango-core = { path = "../../crates/mango-core" }
mango-example-support = { path = "../mango-example-support" }
mango-shim-claude-agent = { path = "../../crates/mango-shim-claude-agent" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "2"
