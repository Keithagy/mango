[package]
name = "mango-debate-poc"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
mango-core = { path = "../../crates/mango-core" }
mango-example-support = { path = "../mango-example-support" }
mango-shim-claude-agent = { path = "../../crates/mango-shim-claude-agent" }
mango-shim-codex = { path = "../../crates/mango-shim-codex" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "2"
