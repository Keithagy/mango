[package]
name = "mango-code-agent"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
mango-core = { path = "../../../crates/kernel/core" }
mango-example-support = { path = "../../support/mango-example-support" }
mango-shim-claude-agent = { path = "../../../crates/bridges/claude-agent" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "2"

[dev-dependencies]
mango-bdd = { path = "../../../crates/testing/bdd" }
